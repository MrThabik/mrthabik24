blog:"What a teach pendant really does on a FANUC robot|Nov 2026\nA teach pendant is the handheld controller used to move a robot by hand, record its positions and edit its program. You jog the arm with the keys, save each position as a point, then set the speed and the type of move between points.\nTwo safety parts matter most: the enable (deadman) switch, which only lets the robot move while it is held, and the emergency stop. A robot should never be moved without checking both first.\nTouch-ups are small corrections to a taught point, for example when a fixture has shifted slightly. Doing them carefully, one point at a time, keeps the whole cycle repeatable.\n\nTool offsets on a VMC, in plain words|Nov 2026\nA machining centre does not know how long or how wide each cutter really is. Tool offsets tell the control, so the program can stay the same while the real tool changes.\nThe length offset says where the tool tip sits compared with the machine's reference point. The wear offset is a small adjustment, often a few hundredths of a millimetre, used to bring a dimension back into tolerance after the tool wears.\nA wrong offset is a common reason for a scrapped part or a crash, so the habit is: measure, enter, check on the first piece, then run.\n\n5S on the shop floor in five steps|Nov 2026\n5S is a simple routine for keeping a workplace safe and easy to work in. Sort: keep only what the job needs. Set in order: give every tool and item a marked place. Shine: clean as you work, because cleaning also shows leaks and damage early. Standardise: make the rules and labels the same for every shift. Sustain: keep checking, with short daily walk-rounds and a quick talk at the start of the shift.\nWhen all five are followed, searching time drops, mistakes drop and handovers between shifts become easier.\n\nHow my solar and wind charging model works|Nov 2026\nMy academic project charges one 12 V battery from two sources: a solar panel and a small DC motor turning as a wind generator. Passive parts in each path stop the battery from pushing current back into the source.\nAn Arduino Uno reads a voltage sensor and a current sensor and shows the values on an LCD, so the charging can be watched in real time. An inverter then turns the stored DC power into 220 V AC to run a 10 W LED bulb.\nThe main lesson was that two weak sources together keep the load running longer than either alone, and that measuring is as important as building.",
ta:{"tag": "மின்சாரம் மற்றும் மின்னணுவியல் டிப்ளமோ பொறியாளர்: மின்சாரம் மற்றும் தொலைத்தொடர்புப் பணி, உற்பத்தி ஷிஃப்ட் பொறுப்பு, FANUC ரோபோ மற்றும் CNC/VMC இயக்கம். தமிழ்நாடு.", "summary": "TVS சுந்தரம்-கிளேட்டனில் ஷிஃப்ட் செயல்பாடுகள், FANUC ரோபோ நிரலாக்கம் மற்றும் VMC இயக்கம் ஆகியவற்றில் நேரடி அனுபவம் கொண்ட, செயல்முறையில் கவனம் செலுத்தும் பொறியாளர். 5S, பாதுகாப்பு மேலாண்மை மற்றும் நவீன டிஜிட்டல் கருவிகளிலும் பயிற்சி பெற்றவர்.", "exp": "TVS சுந்தரம்-கிளேட்டன் லிமிடெட், ஒரகடம் ஆலை, சென்னை\nஉற்பத்திப் பொறியியல் துறை / ஷிஃப்ட் இன்-சார்ஜ் (OPED), மே 2025 – ஆகஸ்ட் 2026\nஅதிக அழுத்த டை காஸ்டிங் பிரிவில் ஷிஃப்ட் செயல்பாடுகளை வழிநடத்தி, உற்பத்தி இலக்குகளையும் தர அளவீடுகளையும் எட்டினேன்.\n6-அச்சு FANUC ரோபோக்களில் டீச் பெண்டன்ட் இயக்கம், நிரல் மேம்பாடு மற்றும் சிறு திருத்தங்களைச் செய்தேன்.\nகருவி ஆஃப்செட் சரிசெய்தலுடன் VMC இயந்திரத்தில் வெட்டுதல், மில்லிங் மற்றும் போரிங் பணிகளுக்கு உதவினேன்.\nதொழில்நுட்பர்களுடன் இணைந்து உற்பத்தி வரிசை நிறுத்தங்களைத் தீர்த்து, பழுது நேரத்தைக் குறைத்தேன்.\nதினசரி பாதுகாப்பு உரைகளை நடத்தி, பணியிடத்தில் 5S ஒழுக்கத்தைப் பேணினேன்.", "edu": "மின்சாரம் மற்றும் மின்னணுவியல் பொறியியல் டிப்ளமோ (DEEE)\nஅரசு பாலிடெக்னிக் கல்லூரி, உசிலம்பட்டி, மதுரை, 2022 – 2025\n78% – சிறப்புத் தேர்ச்சியுடன் முதல் வகுப்பு\n\nஇடைநிலைப் பள்ளி இறுதிச் சான்றிதழ் (SSLC)\nசர்ச் ஆஃப் சவுத் இந்தியா (CSI) மேல்நிலைப் பள்ளி, 2021 – 2022\n60%", "proj": "புதுப்பிக்கத்தக்க ஆற்றல் வளங்களுடன் கலப்பின மின் அமைப்பு\nநேரடி கண்காணிப்புடன் சூரிய–காற்று மின்னேற்றம்\n12V சூரியத் தகடும், காற்றாலையாகச் செயல்படும் 12V DC மோட்டாரும் ஒரு 12V பேட்டரியை மின்னேற்றுகின்றன.\nArduino Uno மின்னழுத்த மற்றும் மின்னோட்ட சென்சார்களைப் படித்து LCD-யில் காட்டுகிறது.\n150W DC–220V AC இன்வெர்ட்டர் 10W LED விளக்கை இயக்குகிறது.\nமுடிவு: மாறும் வானிலையிலும் தொடர்ச்சியான மின்சாரம்; குறைந்த செலவு, தொலைதூரப் பகுதிகளுக்கு ஏற்றது.", "skills": "ரோபோட்டிக்ஸ்: FANUC ரோபோ இயக்கம், நிரல் திருத்தம், டீச் பெண்டன்ட், சிறு திருத்தங்கள்\nஇயந்திரப் பணி: VMC இயக்கம், G-code மற்றும் M-code, கருவி ஆஃப்செட், போரிங், மில்லிங்\nமின்சாரம்
